name: Update Philippine news headlines

on:
  schedule:
    # Daily at 8:00 AM Philippine time (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch recent Philippine headlines
        run: python .github/scripts/update_news.py
      - name: Commit updated headlines
        run: |
          if git diff --quiet -- news.json; then
            echo "News feed is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update daily Philippine news headlines"
          git push
